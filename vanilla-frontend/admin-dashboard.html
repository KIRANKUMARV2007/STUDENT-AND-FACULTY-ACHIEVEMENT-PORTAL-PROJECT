<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Technova</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 1rem; margin-bottom: 2rem; }
        h1 { margin: 0; color: #f59e0b; } /* Orange for admin */
        .logout-btn { background-color: #ef4444; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        .logout-btn:hover { background-color: #dc2626; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; max-width: 600px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>System Admin Dashboard</h1>
        <button id="logoutBtn" class="logout-btn">Log Out</button>
    </div>

    <div class="card">
        <h2>Welcome, Admin!</h2>
        <p>You have successfully authenticated using Supabase Auth and been routed here based on your role in the <code>public.users</code> table.</p>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js';
        
        // 1. Session Protection
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
            window.location.href = 'index.html';
        }

        // 2. Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            const { error } = await supabase.auth.signOut();
            if (error) {
                console.error('Error logging out:', error.message);
                alert('Failed to log out.');
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
